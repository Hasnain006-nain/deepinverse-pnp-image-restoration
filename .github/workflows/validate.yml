name: Validate Results

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-results:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run automated experimental results validation
        run: |
          python scripts/validate_results.py
